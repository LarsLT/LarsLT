name: Generate space map

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/space-map/**"
      - ".github/workflows/space-map.yml"

permissions:
  contents: write

concurrency:
  group: space-map
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/space-map

    steps:
      - uses: actions/checkout@v4

      # No dependencies, so nothing to cache and no go.sum to key it on.
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/space-map/go.mod
          cache: false

      # The last good response from each upstream, so a rate-limited run still
      # draws every layer. Rolling key: each run restores the previous one.
      - name: Restore upstream cache
        uses: actions/cache@v4
        with:
          path: tools/space-map/cache
          key: space-map-sources-${{ github.run_id }}
          restore-keys: space-map-sources-

      - name: Test
        run: go test ./...

      # NOAA blocks the dev machine outright. If a runner gets through, the real
      # OVATION grid becomes an option on top of the Kp-derived oval. This is a
      # question, not a check, so it only runs when the build is kicked by hand.
      - name: Probe SWPC OVATION
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            https://services.swpc.noaa.gov/json/ovation_aurora_latest.json || echo failed)
          echo "SWPC OVATION responded $code"

      - name: Build the map
        run: go run . -out dist -cache cache

      # Camo blocks external fetches and GitHub strips scripts and SMIL, so any
      # of them in the output means a broken image on the profile. Every check
      # is written as an if/exit: a bare `! grep` is exempt from `set -e` and
      # would pass the step no matter what it found.
      - name: Check nothing GitHub strips crept in
        run: |
          if grep -qiE '<script|<animate|<set |onload=|javascript:' dist/space-map.svg; then
            echo "GitHub strips one of script/SMIL/event handlers from the SVG"
            exit 1
          fi
          # Only fetching attributes matter. Namespace names are w3.org URLs that
          # nothing ever requests, so the whole domain is allowed.
          if grep -oE '(href|src|xlink:href)="https?://[^"]+' dist/space-map.svg |
             grep -v 'https\?://[^"]*w3\.org/'; then
            echo "external reference in the SVG"
            exit 1
          fi
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('dist/space-map.svg')"
          bytes=$(wc -c < dist/space-map.svg)
          echo "space-map.svg is $bytes bytes"
          if [ "$bytes" -gt 262144 ]; then
            echo "over the 256 KB budget, camo will be slow"
            exit 1
          fi

      - name: Push the SVG to the space branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: space
          build_dir: tools/space-map/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
